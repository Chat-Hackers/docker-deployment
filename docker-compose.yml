services:
  apps:
    environment:
      - DUCKDB_DATA_DIR=/data
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
        VITE_AUTH_LINK: ${VITE_AUTH_LINK}
        VITE_WRAPPER_URL: ${VITE_WRAPPER_URL}
        VITE_TRELLO_KEY: ${VITE_TRELLO_KEY}
    volumes:
      - ./secrets:/apps/tool-hub/registrations:ro
      - duckdb-data:/data

    # Container name makes it easier to find in `docker ps`
    container_name: chathackers_uk

    restart: unless-stopped

    # ── Traefik labels ─────────────────────────────────────────────
    labels:
      # Tell Traefik to watch this container
      - "traefik.enable=true"

      # Which Docker network Traefik should use to reach this container
      - "traefik.docker.network=traefik"

      # ── tool-hub ──────────────────────────────────────────────────
      # Router: matches requests for chathackers.uk
      - "traefik.http.routers.chathackers_uk.rule=Host(`${DASHBOARD_URL}`)"
      - "traefik.http.routers.chathackers_uk.entrypoints=web-secure"
      - "traefik.http.routers.chathackers_uk.tls.certresolver=default"
      # Service: tells Traefik which port to forward to
      - "traefik.http.routers.chathackers_uk.service=chathackers_uk-svc"
      - "traefik.http.services.chathackers_uk-svc.loadbalancer.server.port=8138"

    # ── Networking ────────────────────────────────────────────────
    networks:
      - traefik

    env_file:
      - .env

# Reference the pre-existing Traefik network (don't recreate it here)
networks:
  traefik:
    external: true

volumes:
  duckdb-data: